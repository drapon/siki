[package]
name = "siki"
version = "0.1.22"
edition = "2024"
description = "TUI orchestrator for managing multiple Claude Code sessions across git worktrees"
license = "MIT"
repository = "https://github.com/drapon/siki"

[dependencies]
anyhow = "1.0.102"
arboard = "3"
chrono = "0.4.43"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
rand = "0.9"
git2 = "0.20.4"
portable-pty = "0.9.0"
ratatui = "0.30.0"
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
syntect = "5.3.0"
tokio = { version = "1.49.0", features = ["full"] }
toml = "1.0.3"
tui-term = "0.3.1"
vt100 = "0.16.2"

[dev-dependencies]
tempfile = "3.25.0"
